<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Удаление профиля</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #1a202c;
      color: #e2e8f0;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .confirm-container {
      max-width: 500px;
      width: 100%;
      background-color: #2d3748;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      border: 2px solid #ef4444;
    }
    .confirm-title {
      font-size: 2rem;
      font-weight: 700;
      color: #ef4444;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .confirm-text {
      color: #e2e8f0;
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }
    .button {
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      width: 100%;
      margin-bottom: 0.75rem;
    }
    .button-danger {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }
    .button-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
    }
    .button-secondary {
      background-color: #4a5568;
      color: #e2e8f0;
    }
    .button-secondary:hover {
      background-color: #2d3748;
    }
  </style>
</head>
<body>
  <div class="confirm-container">
    <h2 class="confirm-title">⚠️ Удаление профиля</h2>
    
    <div class="confirm-text">
      <p><strong>Внимание!</strong> Вы собираетесь удалить свой профиль.</p>
      <p style="margin-top: 1rem;">Это действие необратимо и приведет к удалению:</p>
      <ul style="margin-left: 1.5rem; margin-top: 0.75rem;">
        <li>Вашего аккаунта</li>
        <li>Всех результатов тестов</li>
        <li>Аватарки и описания профиля</li>
        <li>Всех связанных данных</li>
      </ul>
      <p style="margin-top: 1rem; color: #fc8181;">
        <strong>После удаления восстановление будет невозможно!</strong>
      </p>
    </div>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="button button-danger">
        Да, удалить мой профиль навсегда
      </button>
    </form>

    <button type="button" class="button button-secondary" onclick="window.location.href='/profile'">
      Отмена, вернуться в профиль
    </button>
  </div>
</body>
</html>
