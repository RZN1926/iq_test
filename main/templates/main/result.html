<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Результат IQ Теста</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% load static %}
  <style>
    body {
      background-color: #1a202c;
      color: #e2e8f0;
      font-family: 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .result-container {
      max-width: 600px;
      width: 100%;
      background-color: #2d3748;
      padding: 2.5rem;
      border-radius: 0.75rem;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .result-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #63b3ed;
      margin-bottom: 1.5rem;
    }
    .result-score {
      font-size: 3rem;
      font-weight: 800;
      color: #edf2f7;
      background-color: #2b6cb0;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .result-text {
      font-size: 1.25rem;
      color: #a0aec0;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .nav-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .button {
      padding: 1rem 2rem;
      font-size: 1.25rem;
      font-weight: 600;
      border-radius: 0.5rem;
      transition: all 0.3s ease;
      margin: 0.5rem;
      cursor: pointer;
    }
    .button-primary {
      background-color: #3b82f6;
      color: white;
      border: none;
    }
    .button-primary:hover {
      background-color: #2563eb;
      transform: scale(1.05);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div class="result-container">
    <h2 class="result-title">Результат IQ Теста</h2>
    <div class="result-score">{{ iq }}</div>
    <p class="result-text">Ваш IQ: {{ iq }}</p>
    <p class="result-text">Из {{ total }} вопросов вы ответили правильно на {{ score }}.</p>
    <p class="result-text">Спасибо за прохождение теста! Хотите попробовать еще раз?</p>
    <div class="nav-links">
      <button class="button button-primary" onclick="window.location.href='/profile'">Профиль</button>
      <button class="button button-primary" onclick="window.location.href='/leaderboard'">Рейтинг</button>
      <button class="button button-primary" onclick="window.location.href='/test'">Пройти снова</button>
    </div>
  </div>
</body>
</html>
