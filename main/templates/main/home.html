<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Тест</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <style>
      body {
        background-image: url('/static/man.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: 'Arial', sans-serif;
      }
      .title {
        font-size: 5rem;
        font-weight: bold;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        margin-bottom: 2rem;
        text-transform: uppercase;
      }
      .button {
        padding: 1rem 2rem;
        font-size: 1.25rem;
        font-weight: 600;
        border-radius: 0.5rem;
        transition: all 0.3s ease;
        margin: 0.5rem;
        cursor: pointer;
      }
      .button-primary {
        background-color: #3b82f6;
        color: white;
        border: none;
      }
      .button-primary:hover {
        background-color: #2563eb;
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }
      .button-secondary {
        background-color: #ef4444;
        color: white;
        border: none;
      }
      .button-secondary:hover {
        background-color: #dc2626;
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }
      .overlay {
        background: rgba(0, 0, 0, 0.5);
        padding: 2rem;
        border-radius: 1rem;
      }
      .welcome-text {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
      }
    </style>
</head>
<body>
  <div class="overlay text-center">
    <h1 class="title">IQ Тест</h1>
    
    {% if user.is_authenticated %}
        <p class="welcome-text">Добро пожаловать, <strong>{{ user.username }}</strong>!</p>
        <div>
          <button class="button button-primary" onclick="window.location.href='{% url 'profile' %}'">Профиль</button>
          <button class="button button-primary" onclick="window.location.href='{% url 'iq_test' %}'">Начать тест</button>
          <button class="button button-primary" onclick="window.location.href='{% url 'leaderboard' %}'">Рейтинг</button>
        </div>
    {% else %}
        <p class="welcome-text">Войдите или зарегистрируйтесь, чтобы пройти тест</p>
        <div>
          <button class="button button-primary" onclick="window.location.href='{% url 'login' %}'">Войти</button>
          <button class="button button-primary" onclick="window.location.href='{% url 'register' %}'">Регистрация</button>
        </div>
    {% endif %}

  </div>
</body>
</html>
